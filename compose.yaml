services:
  entrust-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entrust-sync
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file:
      - .env
    environment:
      DISPLAY: :99
      # 容器內部 FastAPI HTTP：僅供同容器 nginx 存取，不直接對外發布。
      # 對外 host/port 請修改 .env 的 ENTRUST_API_HOST / ENTRUST_API_PORT。
      ENTRUST_API_HOST: 127.0.0.1
      ENTRUST_API_PORT: 8889
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./output:/app/output
      - ./tls:/app/tls:ro
      # Chromium 仍會建立下列固定目錄；nested tmpfs 讓內容只存在記憶體。
      # 這些掛載不包含 cookies、Local Storage、Sessions 或 ClientCertificates。
      - type: tmpfs
        target: /app/browser_profile/Default/Cache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/Default/Code Cache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/Default/GPUCache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/Default/DawnGraphiteCache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/Default/DawnWebGPUCache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/GrShaderCache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/GraphiteDawnCache
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /app/browser_profile/ShaderCache
        tmpfs:
          size: 67108864
    ports:
      - "0.0.0.0:6080:6080"
      # .env host:port -> 容器 nginx HTTPS 8888 -> FastAPI HTTP 127.0.0.1:8889
      - "${ENTRUST_API_HOST:-0.0.0.0}:${ENTRUST_API_PORT:-8888}:8888"
    security_opt:
      - no-new-privileges:true
